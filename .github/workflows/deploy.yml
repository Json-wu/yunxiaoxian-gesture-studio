name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?缺少 Secret SSH_HOST}"
          : "${SSH_USER:?缺少 Secret SSH_USER}"
          : "${SSH_KEY:?缺少 Secret SSH_KEY}"
          : "${DEPLOY_PATH:?缺少 Secret DEPLOY_PATH}"
          port="${SSH_PORT:-22}"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$port" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -p "$port" \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd $(printf '%q' "$DEPLOY_PATH") && git pull --ff-only origin main"
